[package]
name = "nelson-pdf-builder"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
typst = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts"] }
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
time = { version = "0.3", features = ["local-offset"] }

[dev-dependencies]
tempfile = "3.14"
