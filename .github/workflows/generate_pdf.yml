name: CI

on: [push]

jobs:
  build-pdf:
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fr]

    steps:
      - uses: actions/checkout@v4

      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
        shell: powershell

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install tools via Chocolatey
        run: |
          Write-Host "Installing tools via Chocolatey..."

          # Install Pandoc
          choco install pandoc -y

          # Install wkhtmltopdf
          choco install wkhtmltopdf -y

          # Inkscape is no longer required: SVG rasterization is done in-process by resvg.

          Write-Host "All tools installed successfully via Chocolatey"
        shell: powershell

      - name: Verify installations
        run: |
          Write-Host "Verifying Pandoc..."
          pandoc --version

          Write-Host "`nVerifying wkhtmltopdf..."
          wkhtmltopdf --version
        shell: powershell

      - name: Build PDF (${{ matrix.lang }})
        run: |
          .\pandoc-build-pdf.bat ${{ matrix.lang }}
        shell: cmd

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: nelson-pdf-${{ matrix.lang }}
          path: nelson-${{ matrix.lang }}.pdf
